version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    APP_DB_URL: postgresql+psycopg2://airflow:airflow@postgres:5432/nps_app
    PYTHONPATH: /opt/airflow/project
    _PIP_ADDITIONAL_REQUIREMENTS: "scikit-learn==1.5.1 xgboost==2.1.1 joblib==1.4.2 dill==0.3.8 psycopg2-binary==2.9.9"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./shared:/opt/airflow/project/shared
    - ./scripts:/opt/airflow/project/scripts
    - ./data:/opt/airflow/project/data
    - ./models:/opt/airflow/project/models
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    ports:
      - "5432:5432"

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Tung --lastname Nguyen \
          --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init

  api:
    build: ./api
    environment:
      APP_DB_URL: postgresql+psycopg2://airflow:airflow@postgres:5432/nps_app
    volumes:
      - ./shared:/app/shared
      - ./models:/app/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    environment:
      APP_DB_URL: postgresql+psycopg2://airflow:airflow@postgres:5432/nps_app
      API_URL: http://api:8000
    volumes:
      - ./shared:/app/shared
      - ./models:/app/models
      - ./data:/app/data
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data:
  airflow_logs:
